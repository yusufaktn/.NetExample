<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Koleksiyonu</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Film Koleksiyonu</div>
            <ul>
                <li><a href="#">Ana Sayfa</a></li>
                <li><a href="#">Profil</a></li>
                <li><a href="#">Filmler</a></li>
                <li><a href="#">Arkadaşlar</a></li>
                <li><a href="#">Çıkış</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="dashboard">
            <h1>Hoş Geldiniz!</h1>
            <div class="quick-access">
                <button>Film Ekle</button>
                <button>Arkadaş Ekle</button>
                <button>Profilim</button>
            </div>
            <div class="recommendations">
                <h2>Öneri Geçmişi</h2>
                <div class="card-container">
                    <!-- Örnek Film Kartı -->
                    <div class="card">
                        <img src="https://via.placeholder.com/150" alt="Film Poster">
                        <h3>Film Adı</h3>
                        <p>Kısa açıklama...</p>
                        <button>Detay</button>
                    </div>
                    <!-- Diğer kartlar buraya eklenebilir -->
                </div>
            </div>
            <div class="friends">
                <h2>Arkadaşlar</h2>
                <div class="friend-list">
                    <!-- Örnek Arkadaş Kartı -->
                    <div class="friend-card">
                        <img src="https://via.placeholder.com/50" alt="Arkadaş Avatar">
                        <span>Arkadaş Adı</span>
                    </div>
                    <!-- Diğer arkadaş kartları buraya eklenebilir -->
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Film Koleksiyonu</p>
    </footer>
</body>
</html>
